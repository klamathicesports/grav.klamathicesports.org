name: Community Partners
slug: community-partners
type: plugin
version: 0.1.0
description: Advertisements for Community Partners
icon: fa-handshake-o
author:
  name: Klamath Ice Sports
  email: berto@klamathicesports.org
homepage: https://github.com/klamathicesports/grav.klamathicesports.org
demo: http://demo.yoursite.com
keywords: grav, plugin, etc
bugs: https://github.com/klamathicesports/grav.klamathicesports.org/issues
docs: https://github.com/klamathicesports/grav.klamathicesports.org/plugins/community-partners/README.md
license: MIT

dependencies:
  - { name: grav, version: '>=1.6.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    text_var:
      type: text
      label: PLUGIN_COMMUNITY_PARTNERS.TEXT_VARIABLE
      help: PLUGIN_COMMUNITY_PARTNERS.TEXT_VARIABLE_HELP
