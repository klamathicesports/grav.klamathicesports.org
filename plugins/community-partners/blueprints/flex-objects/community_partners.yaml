title: 'Community Partners'
description: 'Advertisements for Community Partners'
type: flex-objects

# Flex Configuration
config:
    # Administration Configuration
    admin:
        # Admin router (optional)
        router:
            path: '/community_partners'

        # Admin menu (optional)
        menu:
            list:
                route: '/community_partners'
                title: 'Community Partners'
                icon: fa-handshake-o
                # Authorization to collection admin
                authorize: ['admin.community_partners.list', 'admin.super']
                # Priority -10 .. 10 (highest goes up)
                priority: 2

        # Admin template type / folder
        template: default

        # Permissions
        permissions:
            # Primary permissions
            admin.community_partners:
                type: crudpl
                label: 'Community Partners'

        # List view
        list:
            title: name
            fields:
                active:
                    field:
                        type: toggle
                        label: Active
                    width: 8
                name:
                    link: edit
                description:

        # Edit View
        edit:
            title:
                template: ''

        # Preview View
        preview:
            enabled: false
            route:
            #template: '/plugins/flex-objects/directory:contacts'

        # Data Export
        export:
            enabled: true
            method: 'jsonSerialize'
            formatter:
                class: 'Grav\Framework\File\Formatter\YamlFormatter'
            filename: 'community_partners'

    # Site Configuration
    site:
        templates:
            collection:
                # Lookup for the template layout files for collections of objects
                paths:
                    - 'flex/{TYPE}/collection/{LAYOUT}{EXT}'
            object:
                # Lookup for the template layout files for objects
                paths:
                    - 'flex/{TYPE}/object/{LAYOUT}{EXT}'
            defaults:
                # Default template {TYPE}; overridden by filename of this blueprint if template folder exists
                type: 'community_partners'
                # Default template {LAYOUT}; can be overridden in render calls (usually Twig in templates)
                layout: default

    # Data Configuration
    data:
        # Object class to be used, allowing custom methods for the object
        object: 'Grav\Plugin\CommunityPartners\Flex\Types\CommunityPartners\CommunityPartnersObject'
        # Collection class to be used, allowing custom methods for the collections
        collection: 'Grav\Plugin\CommunityPartners\Flex\Types\CommunityPartners\CommunityPartnersCollection'
        # Index class to be used, works as a quick database-like lookup index
        index: 'Grav\Common\Flex\Types\Generic\GenericIndex'
        storage:
            # Storage class, use single file storage (does not support images and assets)
            class: 'Grav\Framework\Flex\Storage\FolderStorage'
            options:
                formatter:
                    # File formatter class, in this case the file is stored in markdown
                    class: 'Grav\Framework\File\Formatter\JsonFormatter'
                # JSON file where all the objects will be stored
                folder: user-data://community-partners
        search:
            # Search options
            options:
                contains: 1
            # Fields to be searched
            fields:
                - name
                - description
                - placement_short_description
form:
    validation: loose
    fields:
        name:
            type: text
            label: Name
            validate:
                required: true
        description:
            type: text
            label: Description
        active:
            type: toggle
            label: Active
            highlight: 1
            default: 1
            options:
                1: PLUGIN_ADMIN.YES
                0: PLUGIN_ADMIN.NO
            validate:
                type: bool
                required: true
        placement_image:
            type: file
            label: Placement Image
            random_name: true
            accept:
                - image/*
        placement_url:
            type: url
            label: Placement URL
            validate:
                required: true
        placement_short_description:
            type: text
            label: Placement Description (max 90 characters)
            validate:
                required: true
                min: 10
                max: 90
